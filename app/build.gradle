apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.skyhosting.control'
    compileSdk 34

    defaultConfig {
        applicationId "com.skyhosting.control"
        // minSdk 26 (Android 8.0+) so the launcher icon can be a pure
        // adaptive vector icon with no external PNG assets needed.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
